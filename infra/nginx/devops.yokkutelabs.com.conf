# Site nginx du serveur (nginx installé en global) : relaie tout le trafic vers le conteneur frontend, qui écoute
# sur 127.0.0.1:3000 et relaie lui-même /api vers le backend. HTTP seulement : `certbot --nginx` ajoute le HTTPS
# et la redirection dans CE fichier (voir docs/exploitation.md). Installé par infra/scripts/setup-vps.sh.
server {
    listen 80;
    listen [::]:80;
    server_name devops.yokkutelabs.com;

    client_max_body_size 1m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
