# CI : données figées (fixture), ports de test du cahier (frontend 3100 via FRONTEND_PORT, backend 8100),
# e2e lancés dans le réseau Compose.
services:
  backend:
    environment: { WEATHER_PROVIDER: fixture }
    ports: ["127.0.0.1:8100:8000"]
  e2e:
    build: { context: ./e2e }
    environment: { E2E_BASE_URL: "http://frontend:8080" }
    depends_on: { frontend: { condition: service_started } }
    profiles: ["e2e"]
    volumes: [./e2e/reports:/e2e/reports]
