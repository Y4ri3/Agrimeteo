# Profil Mil : critères pluviométriques de semis uniquement (aucun seuil thermique sourcé n'a été retenu).
id: mil
label: Mil
version: 0.1.0
status: a_valider
analysis:
  window_days: 30
limits:
  - "Seuils tirés d'études du Sahel (début de saison des pluies, mil au Niger) ; ils restent à valider."
  - "Aucun critère de température pour le mil : aucun seuil sourcé n'a été retenu."
criteria:
  - id: pluie_declenchement
    label: Plus forte pluie sur 3 jours
    indicator: rain_max_3d_mm
    unit: mm
    direction: lower_is_worse
    blocking: true
    thresholds: { vigilance: 20, unfavorable: 10 }
    source: "Sivakumar (1988) : 20 mm sur 2-3 jours déclenchent le semis ; étude « The onset of the rainy season and farmers' sowing strategy for pearl millet cultivation in Southwest Niger » (HAL hal-00584850) : semis du mil dès 10 mm en 2 jours"
  - id: secheresse
    label: Plus longue période sèche
    indicator: max_dry_spell_days
    unit: jours
    direction: higher_is_worse
    blocking: true
    thresholds: { vigilance: 7, unfavorable: 10 }
    source: "Sivakumar (1988) : pas de pause sèche de 7 jours ou plus ; même étude Niger (HAL hal-00584850) : 23 % des semis échouent après une pause de plus de 9 jours"
