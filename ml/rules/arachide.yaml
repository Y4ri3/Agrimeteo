# Profil Arachide : seuils tirés de la littérature, voir ml/README.md. Statut « a_valider » : adaptation d'une
# règle de début de saison des pluies (rétrospective) à une estimation sur fenêtre ; à relire par l'équipe.
id: arachide
label: Arachide
version: 0.1.0
status: a_valider            # a_valider | valide_par_source
analysis:
  window_days: 30
limits:
  - "Seuils tirés de la littérature sahélienne (début de saison des pluies) et de la fiche FAO de l'arachide ; ils restent à valider."
criteria:
  - id: pluie_declenchement
    label: Plus forte pluie sur 3 jours
    indicator: rain_max_3d_mm
    unit: mm
    direction: lower_is_worse
    blocking: true
    thresholds: { vigilance: 20, unfavorable: 10 }
    source: "Sivakumar (1988) : 20 mm sur 2-3 jours déclenchent le semis ; étude « The onset of the rainy season and farmers' sowing strategy for pearl millet cultivation in Southwest Niger » (HAL hal-00584850) : les agriculteurs du Niger sèment dès 10 mm en 2 jours"
  - id: secheresse
    label: Plus longue période sèche
    indicator: max_dry_spell_days
    unit: jours
    direction: higher_is_worse
    blocking: true
    thresholds: { vigilance: 7, unfavorable: 10 }
    source: "Sivakumar (1988) : pas de pause sèche de 7 jours ou plus ; même étude Niger (HAL hal-00584850) : 23 % des semis échouent après une pause de plus de 9 jours"
  - id: chaleur
    label: Température moyenne (chaleur)
    indicator: tmean_c
    unit: °C
    direction: higher_is_worse
    blocking: false
    thresholds: { vigilance: 28, unfavorable: 33 }
    source: "FAO, fiche culture arachide : optimum 22-28 °C, rendement en baisse au-delà de 33 °C"
  - id: fraicheur
    label: Température moyenne (fraîcheur)
    indicator: tmean_c
    unit: °C
    direction: lower_is_worse
    blocking: false
    thresholds: { vigilance: 22, unfavorable: 18 }
    source: "FAO, fiche culture arachide : optimum 22-28 °C, rendement en baisse en dessous de 18 °C"
