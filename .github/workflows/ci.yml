name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  # Sur main, un nouveau push n'interrompt jamais un déploiement en cours.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./ml
      - run: python scripts/check.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: make -C backend setup ci
      - run: python scripts/check_openapi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-reports, path: backend/reports/ }

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: make -C ml setup ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ml-reports, path: ml/reports/ }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: make -C frontend setup ci check-client
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-reports, path: frontend/reports/ }

  # Construit les images, contrôle (non root, sans secret), lance la pile sur les ports 3100/8100, puis Playwright.
  e2e:
    needs: [checks, backend, ml, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: IMAGE_TAG=${{ github.sha }} sh infra/scripts/run-e2e-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-reports, path: e2e/reports/ }

  # Déploiement : main seulement, et seulement si tout est vert (J-04). Déploie, lance le smoke test et
  # revient en arrière en cas d'échec, sur le runner.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh infra/scripts/deploy-local.sh
